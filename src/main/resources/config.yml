# SheepShop 配置
#
# 商店分「房间商店」和「常驻商店」两种：
#   - 房间商店：玩家站进 SheepDungeon 的 SHOP 房间时自动打开，商品来自
#     dungeon/<地牢id>/room/shop_room.yml 的 shop.products（由 SheepDungeon 提供），
#     本文件只控制界面外观和开关。
#   - 常驻商店：不限地牢，玩家用 /shop open <商店id> 打开，商品写在本文件的 shops 段。

# 是否启用房间商店
room-shop-enabled: true

# 进入商店房后自动打开界面的延迟（tick）。20 tick = 1 秒。
# 设 0 表示进房间立刻打开。
room-shop-open-delay: 10

# 界面标题里的地牢币余额占位符是 %coins%
room-shop-title: "§8商店 §7· 地牢币 §e%coins%"

title: "§8商店 §7· 地牢币 §e%coins%"

# 界面行数（1-6）。商品多于一页时自动分成多页。
rows: 3

# 余额不足时的提示
messages:
  no-coins: "§c地牢币不足，还差 §e%need%§c。"
  bought: "§a已购买 §f%item% §7×%amount%§a，花费 §e%price%§a 地牢币。"
  sold-out: "§c这件商品已经卖完了。"
  unknown-item: "§c商品配置有误：找不到物品 §f%id%§c。"
  inventory-full: "§e背包满了，物品掉在你脚下。"
  reloaded: "§a配置已重新加载。"
  players-only: "§c此命令只能由玩家执行。"

# 常驻商店：/shop open <id>
shops:
  # 示例：地牢入口大厅的补给商店
  supply:
    title: "§8补给站 §7· 地牢币 §e%coins%"
    products:
      - item-id: "GOLDEN_APPLE"
        amount: 1
        price: 8
        display: "§6金苹果"
      - item-id: "sheeplin_material:wind_shard"
        amount: 2
        price: 20
        display: "§b风碎片"
      - item-id: "sheeplin_material:earth_essence"
        amount: 1
        price: 45
        display: "§a土精华"
